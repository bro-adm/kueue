# Preemption and Cohort Test Setup
# This manifest creates a cohort with 2 ClusterQueues to test preemption metrics
# Metrics tested: kueue_preempted_workloads_total, kueue_cohort_weighted_share, kueue_cluster_queue_weighted_share

---
# Cohort CR - Required for kueue_cohort_weighted_share metric
apiVersion: kueue.x-k8s.io/v1alpha1
kind: Cohort
metadata:
  name: "test-cohort"
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: "default-flavor"
---
# PriorityClass for high-priority workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 100
globalDefault: false
description: "High priority class for preemption testing"
---
# PriorityClass for low-priority workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: 10
globalDefault: false
description: "Low priority class for preemption testing"
---
# ClusterQueue 1 - Part of cohort with preemption enabled
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: "cq-preempt-1"
spec:
  namespaceSelector: {}
  cohort: "test-cohort"
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: "default-flavor"
      resources:
      - name: "cpu"
        nominalQuota: 2
      - name: "memory"
        nominalQuota: 4Gi
  preemption:
    reclaimWithinCohort: LowerPriority
    withinClusterQueue: LowerPriority
    borrowWithinCohort:
      policy: LowerPriority
---
# ClusterQueue 2 - Part of cohort with preemption enabled
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: "cq-preempt-2"
spec:
  namespaceSelector: {}
  cohort: "test-cohort"
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: "default-flavor"
      resources:
      - name: "cpu"
        nominalQuota: 3
      - name: "memory"
        nominalQuota: 6Gi
  preemption:
    reclaimWithinCohort: LowerPriority
    withinClusterQueue: LowerPriority
    borrowWithinCohort:
      policy: LowerPriority
