---
# Blocker job in CQ2 - high priority, blocks resources in cohort
apiVersion: batch/v1
kind: Job
metadata:
  name: blocker-job
  namespace: kueue-test
  labels:
    kueue.x-k8s.io/queue-name: lq-preempt-2
spec:
  parallelism: 1
  completions: 1
  suspend: true
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: lq-preempt-2
    spec:
      priorityClassName: high-priority
      containers:
      - name: sleep
        image: quay.io/stagex/core-busybox
        command: ["sleep", "300"]
        resources:
          requests:
            cpu: "3"
            memory: "3Gi"
          limits:
            cpu: "3"
            memory: "3Gi"
      restartPolicy: Never
---
